  const CATALOGO_M = {"1": [[[0, 0, 0], [2, 1, 1]], [[0, 0, 1], [1, 2, 0]], [[0, 0, 1], [2, 0, 0]], [[2, 0, 0], [2, 2, 1]]], "2": [[[0, 0, 0], [2, 2, 1]], [[0, 0, 1], [2, 2, 0]], [[1, 0, 1], [2, 2, 0]], [[1, 2, 1], [2, 0, 0]]]};

// ---------- Identidad ----------
// Cada folio se guarda en su propia clave del teléfono. Así, dos pestañas abiertas con folios distintos
// (por ejemplo, un encuestador que asiste a varias personas) nunca se sobrescriben.
let FOLIO = (location.hash||"").replace("#","").toUpperCase(), PRUEBA = 0;
const PREF = "pet_dce_v5_" + CFG.clave + "_";
function leer(k){ try { return JSON.parse(localStorage.getItem(k)||"null"); } catch(e){ return null; } }
function escribir(k,v){ try { localStorage.setItem(k, JSON.stringify(v)); } catch(e){} }
if (!C.folioValido(FOLIO)) {
  PRUEBA = 1; FOLIO = leer(PREF+"prueba_actual") || C.folioAleatorio(Math.random); escribir(PREF+"prueba_actual", FOLIO);
}
const CLAVE = PREF + (PRUEBA ? "prueba_" : "") + FOLIO;
function guardar(){ escribir(CLAVE, S); }
let S = leer(CLAVE) || { folio: FOLIO, prueba: PRUEBA, r:{}, paso:0, cola:[], hechos:{}, inicio:new Date().toISOString(), tarj:{}, maxDecl:0, recibidos:0 };
const PID = C.pid(FOLIO), SEC = C.secuencia(FOLIO);

// ---------- Cola de envío ----------
function ahora(){ return new Date().toISOString(); }
function emitir(hoja, obj, unico){
  if (unico && S.hechos[unico]) return; if (unico) S.hechos[unico]=1;
  const base = { pid:PID, folio:FOLIO, ciudad:CFG.clave, prueba:PRUEBA, ts:ahora() };
  const fila = HOJAS[hoja].map(k => { const v = (k in obj) ? obj[k] : base[k]; return v===undefined||v===null ? "" : v; });
  S.cola.push({ id: FOLIO+"-"+hoja+"-"+(S.cola.length+S.recibidos)+"-"+Date.now().toString(36), hoja, fila });
  guardar(); enviar();
}
async function enviarLote(folio, cola){
  const resp=await fetch(ENVIO.url,{method:"POST",headers:{"Content-Type":"text/plain;charset=utf-8"},body:JSON.stringify({folio, eventos:cola.slice(0,50)})});
  const j=await resp.json(); return (j && Array.isArray(j.recibidos)) ? new Set(j.recibidos) : null;
}
// Envía también lo pendiente de otros folios usados en este teléfono (sesiones anteriores o en otra pestaña).
async function enviarOtros(){
  const claves=[]; for (let i=0;i<localStorage.length;i++){ const k=localStorage.key(i); if (k && k.startsWith(PREF) && k!==CLAVE && !k.startsWith(PREF+"prueba")) claves.push(k); }
  for (const k of claves){ const o=leer(k); if(!o || !Array.isArray(o.cola) || !o.cola.length) continue;
    const ok=await enviarLote(o.folio, o.cola); if(!ok) continue;
    const fresco=leer(k)||o; const antes=fresco.cola.length; fresco.cola=fresco.cola.filter(e=>!ok.has(e.id)); fresco.recibidos=(fresco.recibidos||0)+antes-fresco.cola.length; escribir(k,fresco); }
}
let enviando=false, espera=30000;
async function enviar(){
  pintarEstado();
  if (PRUEBA || !ENVIO.url || enviando || !navigator.onLine) return;   // el modo de prueba nunca envía
  enviando=true;
  try {
    if (S.cola.length){ const ok=await enviarLote(FOLIO, S.cola);
      if (ok){ const antes=S.cola.length; S.cola=S.cola.filter(e=>!ok.has(e.id)); S.recibidos+=antes-S.cola.length; guardar(); espera=30000; } }
    await enviarOtros();
  } catch(e){ espera=Math.min(espera*2, 300000); }
  enviando=false; pintarEstado();
  if (S.cola.length) setTimeout(enviar, espera);
}
addEventListener("online", enviar);
function pintarEstado(){ const el=document.getElementById("estado"); if(!el) return;
  el.textContent = S.cola.length ? (ENVIO.url && !PRUEBA ? `Respuestas por enviar: ${S.cola.length}` : `Guardadas en este teléfono: ${S.cola.length}`) : (PRUEBA ? "" : "Todo enviado"); }

function recepcionClave(a){ if(a.altlab==="SQ") return S.r.recepcion; return a.mixto ? "mixto" : "cristalino"; }
function recepcionTexto(a){ const k=recepcionClave(a); return k==="mixto" ? "Recibe PET mixto: transparente y de colores" : k==="separado" ? "Recibe el PET separado, por color o por tipo" : "Solo recibe PET cristalino o transparente"; }
function recepcionFrase(a){ const k=recepcionClave(a); return k==="mixto" ? "el PET mixto, transparente y de colores" : k==="separado" ? "el PET separado, por color o por tipo" : "solo el PET cristalino o transparente"; }
const pesos = x => "$" + Number(x).toFixed(2);
const vozPesos = x => { const e=Math.floor(x+1e-9), c=Math.round((x-e)*100); return c ? `${e} pesos con ${c} centavos` : `${e} pesos`; };
const dist = (x,u) => u==="min" ? `${x} min` : `${String(x).replace(".",".")} km`;
const vozDist = (x,u) => u==="min" ? `${x} minutos` : (x===1 ? "1 kilómetro" : `${x} kilómetros`);
const kg = x => `${Number(x).toLocaleString("es-MX")} kg`;
function recordatorioUnidad(){ const u=S.r.unidad_venta; if(u==="conjunta_yo"||u==="conjunta_otro") return "Cuente todo lo que venden juntos, no solo lo suyo."; if(u==="propia") return "Cuente solo lo que vende usted."; return ""; }
function piensePrincipal(){ return S.r.n_acopiadores && S.r.n_acopiadores!=="uno" ? "Si le vende a más de uno, piense en el acopiador al que le vendió más PET la semana pasada." : ""; }

const idx = id => PANT.findIndex(x=>x.id===id);
function siguiente(desde){ for(let i=desde+1;i<PANT.length;i++){ if(PANT[i].cuando()) return i; } return idx("gracias"); }

// ---------- Interfaz ----------
const $ = (tag, attrs={}, ...hijos) => { const e=document.createElement(tag); for(const [k,v] of Object.entries(attrs)){ if(k==="class") e.className=v; else if(k.startsWith("on")) e.addEventListener(k.slice(2),v); else if(v!==false&&v!=null) e.setAttribute(k,v===true?"":v); } for(const h of hijos.flat()){ if(h==null||h===false) continue; e.append(h.nodeType?h:document.createTextNode(h)); } return e; };
const val = (x) => typeof x==="function" ? x() : x;
let tInicio=0;

const ZONA_EJERCICIO = /^(card|qty|conf|acc|hrs|ayu|per|men|fin)\d$/;
function enEjercicio(i){ return i!=null && i>=0 && ZONA_EJERCICIO.test(PANT[i].id); }
function ir(i, sinHistorial){ if(!sinHistorial){ S.hist=S.hist||[]; S.hist.push(S.paso); } S.paso=i; guardar(); pintar(); }
function avanzar(destino){ if (destino) return ir(idx(destino)); ir(siguiente(S.paso)); }
function anterior(){ const h=S.hist||[]; return h.length ? h[h.length-1] : null; }
function puedeVolver(){ const P=PANT[S.paso], prev=anterior(); if(prev==null) return false; if(["intro","gracias"].includes(P.id)) return false; return !enEjercicio(S.paso) && !enEjercicio(prev); }
function volver(){ if(!puedeVolver()) return; const prev=S.hist.pop(); S.paso=prev; guardar(); pintar(); }
function limpiarNoAplicables(){ PANT.forEach(P=>{ if(P.campo && !P.t && !P.cuando()) delete S.r[P.campo]; }); const r=S.r;
  if(r.pago_forma!=="otra") delete r.pago_otra;
  if(!(r.colonias_recoleccion||[]).includes("NO_ESTA")) delete r.colonias_recoleccion_otra;
  if(!(r.colonia_acopiador||[]).includes("NO_ESTA")) delete r.colonia_acopiador_otra; }

function pintar(){
  const P = PANT[S.paso]; const main=document.getElementById("main"); main.innerHTML="";
  const pie=document.getElementById("pie"); pie.innerHTML="";
  let voz=""; const btn=(txt, ok, fn, cls="primario") => { const b=$("button",{class:"btn "+cls, onclick:()=>{ if(!ok()) return; fn(); }}, txt); b.disabled=!ok(); pie.append(b); return b; };
  const titulo=(t)=>{ const h=$("h1",{tabindex:"-1"},t); main.append(h); voz+=t+" "; return h; };
  const nota=(t)=>{ if(!t) return; main.append($("p",{class:"nota"},t)); voz+=t+" "; };
  const refrescar=()=>{ const b=pie.querySelector(".primario"); if(b&&b._ok) b.disabled=!b._ok(); };
  tInicio=performance.now();

  if (P.tipo==="info"){
    titulo(P.titulo); if(P.texto){ main.append($("p",{class:"texto"},P.texto)); voz+=P.texto+" "; }
    if(P.lista){ main.append($("ul",{class:"lista"},P.lista.map(x=>$("li",{},x)))); voz+=P.lista.join(" ")+" "; }
    nota(P.nota); btn(P.boton,()=>true,()=>avanzar());
  }
  else if (P.tipo==="uno"){
    const t=P.t, store = t ? S.tarj[t] : S.r, campo = t ? P.campoT : P.campo;
    titulo(val(P.titulo)); nota(val(P.nota));
